<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una tarjeta dibujada para tu cumpleaños.">
  <meta name="theme-color" content="#eee0c6">
  <title>Feliz cumpleaños, Angeliux 🎂</title>
  <style>
    :root {
      color-scheme: light;

      --tinta: #4a4036;
      --papel-claro: #f6ecd8;
      --papel: #eee0c6;
      --papel-oscuro: #e2d0b2;
      --rosa: #e7b9c4;
      --rosa-linea: #cf94a2;
      --azul: #bcd3e6;
      --azul-linea: #8aa9c4;
      --verde: #cfe0bd;
      --verde-linea: #8fa878;
      --flama: #f2c45e;
      --flama-linea: #c99a3e;
      --pelo: #f6e6cd;
      --pelo-medio: #f0dcc0;
      --oreja: #c79a74;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px 14px 40px;
      background: #d9d3c4;
      color: var(--tinta);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Los filtros viven en un SVG aparte y se referencian por id desde todas
       las viñetas, para no repetir las definiciones cuatro veces. */
    .defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: min(100%, 420px);
      margin: 0 auto;
      padding: 10px 12px 18px;
      background:
        radial-gradient(ellipse at 36% 16%, var(--papel-claro) 0%, var(--papel) 58%, var(--papel-oscuro) 100%);
      box-shadow: 0 12px 30px rgba(50, 40, 25, 0.3);
    }

    .banner {
      display: block;
      width: 100%;
      margin-bottom: 2px;
    }

    /* Separada del rótulo para que respire: pegada se leía como parte de él */
    .subtitle {
      margin: 16px 0 18px;
      color: #8a7a60;
      text-align: center;
    }

    .subDate {
      display: block;
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* Segunda línea subordinada: más chica y en cursiva para marcar jerarquía */
    .subNote {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      font-style: italic;
      letter-spacing: 0.8px;
      opacity: 0.85;
    }

    /* Viñetas: aparecen una tras otra y se quedan, para poder releer la tira */
    .panel {
      margin-bottom: 12px;
      overflow: hidden;
      opacity: 0;
      max-height: 0;
      transform: translateY(10px);
      transition:
        opacity 0.5s ease,
        transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
        max-height 0.6s cubic-bezier(0.2, 0.8, 0.2, 1),
        margin-bottom 0.4s ease;
    }

    .panel:not(.show) {
      margin-bottom: 0;
    }

    /* Tope holgado: si queda corto, la viñeta de la foto se recorta */
    .panel.show {
      opacity: 1;
      max-height: 1400px;
      transform: none;
    }

    .panel svg {
      display: block;
      width: 100%;
    }

    /*
      text-wrap: balance reparte las líneas de forma pareja en lugar de llenar
      la primera y dejar una palabra sola abajo. El max-width es el respaldo:
      en navegadores que no lo soporten, al menos acota el largo de línea para
      que el corte no quede tan desbalanceado.
    */
    .caption {
      max-width: 40ch;
      margin: 0 auto;
      padding: 7px 10px 2px;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
      text-wrap: balance;
    }

    .hint {
      display: block;
      margin-top: 4px;
      color: #8a7a60;
      font-size: 11.5px;
      letter-spacing: 0.4px;
      text-wrap: balance;
    }

    /*
      Pegado al borde inferior con sticky: así sigue a la vista mientras se
      recorre la tira, en lugar de quedarse atrás entre dos viñetas.
    */
    .chip {
      position: sticky;
      z-index: 30;
      bottom: 12px;
      display: block;
      width: 100%;
      min-height: 48px;
      margin: 10px 0 4px;
      padding: 12px 18px;
      border: 2px solid var(--tinta);
      border-radius: 26px 22px 26px 20px;
      background: var(--flama);
      color: var(--tinta);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 0 var(--tinta), 0 8px 18px rgba(70, 56, 34, 0.26);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .chip:hover:not(:disabled) {
      box-shadow: 0 3px 0 var(--tinta);
      transform: translateY(-2px);
    }

    .chip:active:not(:disabled) {
      box-shadow: none;
      transform: translateY(0);
    }

    .chip.hidden {
      display: none;
    }

    .chip:focus-visible,
    .cakeBtn:focus-visible,
    .musicBtn:focus-visible {
      outline: 3px solid var(--azul-linea);
      outline-offset: 3px;
    }

    .cakeBtn {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      -webkit-appearance: none;
      appearance: none;
      background: none;
      cursor: pointer;
    }

    .cakeBtn:disabled {
      cursor: default;
    }

    /* Trazos */
    .ink {
      fill: none;
      stroke: var(--tinta);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#wob);
    }

    .thin {
      fill: none;
      stroke: var(--tinta);
      stroke-width: 1.6;
      stroke-linecap: round;
      filter: url(#wobSoft);
    }

    .fur {
      fill: none;
      stroke: #9a7a5c;
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0.75;
      filter: url(#wobSoft);
    }

    .scrib {
      fill: none;
      stroke-width: 2.6;
      stroke-linecap: round;
      opacity: 0.26;
      filter: url(#wob);
    }

    /*
      Las llamas y el humo van SIN filtro a propósito. Son 53 elementos y se
      animan: un filtro de turbulencia sobre algo animado se recalcula en cada
      cuadro, y en un celular eso se arrastra. A 5px de alto el temblor no se
      nota, así que no se pierde nada.
    */
    .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flicker 0.85s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      from {
        transform: scale(1) rotate(-5deg);
      }
      to {
        transform: scale(1.18) rotate(5deg);
      }
    }

    .smoke {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    @keyframes puff {
      0% {
        opacity: 0.5;
        transform: translateY(0) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translateY(-18px) scale(1.6);
      }
    }

    .tail {
      transform-box: fill-box;
      transform-origin: 8% 85%;
      animation: wag 1.1s ease-in-out infinite alternate;
    }

    /* Cabeceo de quien está comiendo, muy leve para que no se vea tieso */
    .munch {
      transform-box: fill-box;
      transform-origin: 20% 40%;
      animation: munch 0.9s ease-in-out infinite alternate;
    }

    @keyframes munch {
      from {
        transform: translateY(0) rotate(0deg);
      }
      to {
        transform: translateY(3px) rotate(1.6deg);
      }
    }

    .humo path {
      animation: driftUp 3.2s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes driftUp {
      0% {
        opacity: 0;
        transform: translateY(6px);
      }
      30% {
        opacity: 0.6;
      }
      100% {
        opacity: 0;
        transform: translateY(-14px);
      }
    }

    /* Corazoncitos de gusto, subiendo */
    .yum path {
      animation: yumFloat 2.6s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes yumFloat {
      0% {
        opacity: 0;
        transform: translate(0, 6px) scale(0.6);
      }
      35% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(8px, -18px) scale(1.1);
      }
    }

    @keyframes wag {
      from {
        transform: rotate(-9deg);
      }
      to {
        transform: rotate(13deg);
      }
    }

    /* Soplido: cachetes inflados y chorro de aire, solo al tocar */
    .cheek,
    .puffLine {
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .blowing .cheek,
    .blowing .mouthO {
      opacity: 1;
    }

    /*
      Notas musicales. Sin filtro de turbulencia a propósito: flotan, y filtrar
      algo animado obliga al navegador a recalcularlo en cada cuadro. A este
      tamaño el temblor del trazo no se notaría.
    */
    .notaInk {
      fill: none;
      stroke: #6e97bd;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nota {
      animation: flotar 3.4s ease-in-out infinite alternate;
    }

    @keyframes flotar {
      from {
        transform: translateY(2px) rotate(-5deg);
      }
      to {
        transform: translateY(-7px) rotate(6deg);
      }
    }

    .blowing .puffLine {
      opacity: 0.8;
      animation: gust 0.5s ease-out;
    }

    @keyframes gust {
      from {
        transform: translateX(-6px) scaleX(0.6);
      }
      to {
        transform: translateX(10px) scaleX(1.1);
      }
    }

    /* Apagón, como cuando bajan la luz para cantar */
    .dim {
      position: fixed;
      z-index: 40;
      inset: 0;
      opacity: 0;
      background: #171208;
      pointer-events: none;
      transition: opacity 0.75s ease;
    }

    .dim.on {
      opacity: 0.8;
    }

    .confetti {
      position: fixed;
      z-index: 45;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bit {
      position: absolute;
      top: -24px;
      width: 8px;
      height: 13px;
      border-radius: 2px;
      opacity: 0;
      animation: drop var(--time, 3.4s) linear forwards;
    }

    @keyframes drop {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg);
      }
      8% {
        opacity: 1;
      }
      100% {
        opacity: 0.9;
        transform: translate(var(--drift, 30px), 104vh) rotate(var(--spin, 540deg));
      }
    }

    /* Foto, montada como un recorte pegado en la hoja */
    /* Reproductor */
    /*
      Fijo a la ventana y no a la hoja: la tira es larga y en el celular el
      botón se perdía arriba en cuanto bajabas. z-index por encima del apagón
      para que siga siendo alcanzable incluso mientras se apagan las velitas.
    */
    .musicBtn {
      position: fixed;
      z-index: 50;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--tinta);
      border-radius: 50%;
      background: var(--papel-claro);
      color: var(--tinta);
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .musicBtn:hover {
      box-shadow: 0 3px 0 var(--tinta);
      transform: translateY(-2px);
    }

    .musicBtn.playing {
      background: var(--flama);
    }

    .musicPanel {
      width: 100%;
      max-height: 0;
      margin-top: 0;
      visibility: hidden;
      overflow: hidden;
      opacity: 0;
      transition:
        max-height 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
        margin-top 0.5s ease,
        opacity 0.35s ease,
        visibility 0s linear 0.5s;
    }

    .musicPanel.show {
      max-height: 290px;
      margin-top: 10px;
      visibility: visible;
      opacity: 1;
      transition-delay: 0s;
    }

    .musicEmbed {
      position: relative;
      aspect-ratio: 16 / 9;
      max-height: 230px;
      overflow: hidden;
      border: 2px solid var(--tinta);
      background: #121212;
      color: #fff;
    }

    .musicEmbed::before {
      content: "Cargando la canción…";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .musicEmbed > * {
      position: relative;
      z-index: 1;
    }

    .musicPanel iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .musicFallback {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      color: #7d6c50;
      font-size: 12px;
      font-weight: 700;
    }

    .musicFallback:focus-visible {
      outline: 3px solid var(--azul-linea);
      outline-offset: 2px;
    }

    @media (max-width: 380px) {
      body {
        padding: 14px 8px 32px;
      }

      .page {
        padding: 8px 9px 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
      }

      .bit {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="dim" id="dim" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <!-- Filtros compartidos: el temblor del trazo y el grano del papel -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <filter id="wob" x="-14%" y="-14%" width="128%" height="128%">
        <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="wobSoft" x="-14%" y="-14%" width="128%" height="128%">
        <feTurbulence type="fractalNoise" baseFrequency="0.036" numOctaves="2" seed="23" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
        <feColorMatrix type="saturate" values="0"/>
      </filter>

      <!-- Nota musical reutilizable: se coloca con <use> y un translate -->
      <g id="nota">
        <ellipse class="notaInk" cx="0" cy="0" rx="6" ry="4.6"
                 fill="#c8dcee" transform="rotate(-18)"/>
        <path class="notaInk" d="M5 -1 V-25"/>
        <path class="notaInk" d="M5 -25 q11 3 14 11"/>
      </g>

      <!--
        El perrito se define una sola vez y se reutiliza con <use> en las dos
        viñetas, para que no puedan quedar distintos entre sí.

        Geometría pensada para que nada se encime:
          - ojos en y=88..90, hocico arriba en y=100 → no se tocan
          - la oreja caída cuelga por FUERA de la cabeza (x 130..170), nunca
            sobre el ojo derecho que está en x=114
          - hocico, patas, cola y patita alzada arrancan DENTRO de la silueta
            para que se lean pegados y no como bultos sueltos

        Los colores van en hexadecimal y no con var(): dentro de un atributo
        de presentación SVG, Chrome no resuelve las variables CSS y todo
        terminaba saliendo sin color.
      -->
      <g id="dogArt">
        <!-- cola, pegada al costado izquierdo del cuerpo -->
        <g class="tail">
          <path class="ink" d="M62 192 q-22 -4 -30 -20 q-6 -12 2 -18 q6 16 30 24 Z" fill="#e8d4b8"/>
          <path class="fur" d="M44 176 l-8 -3 M38 166 l-8 -2 M36 156 l-7 -4"/>
        </g>

        <!-- cuerpo -->
        <path class="ink"
              d="M100 144 q46 0 46 42 q0 42 -46 42 q-46 0 -46 -42 q0 -42 46 -42 Z"
              fill="#f0dcc0"/>
        <g class="fur">
          <path d="M58 168 l-8 -5 M56 182 l-9 -3 M142 168 l8 -5 M144 182 l9 -3"/>
        </g>

        <!-- patitas de abajo, nacen dentro del cuerpo -->
        <path class="ink" d="M74 216 q0 16 2 20 q10 4 18 0 q2 -6 2 -20 Z" fill="#f6e6cd"/>
        <path class="ink" d="M110 216 q0 16 2 20 q10 4 18 0 q2 -6 2 -20 Z" fill="#f6e6cd"/>
        <g class="thin">
          <path d="M80 232 v5 M86 232 v5 M116 232 v5 M122 232 v5"/>
        </g>

        <!-- patita alzada: arranca dentro del cuerpo y sube -->
        <g class="paw">
          <path class="ink" d="M138 180 q20 -4 28 -18 q6 -10 14 -4 q6 6 -2 16 q-12 16 -34 16 Z"
                fill="#f6e6cd"/>
        </g>

        <!-- cabeza -->
        <path class="ink"
              d="M100 56 q44 0 44 40 q0 40 -44 40 q-44 0 -44 -40 q0 -40 44 -40 Z"
              fill="#f6e6cd"/>

        <!-- oreja parada, a la izquierda del gorro -->
        <path class="ink" d="M74 68 q-16 -14 -16 -34 q0 -8 8 -4 q14 8 20 32 Z" fill="#c79a74"/>

        <!-- oreja caída: cuelga por fuera, sin tocar el ojo -->
        <path class="ink" d="M130 70 q22 -6 32 10 q10 18 2 34 q-10 18 -24 8 q-12 -10 -10 -52 Z"
              fill="#c79a74"/>
        <path class="fur" d="M142 92 q6 10 4 22" stroke="#9a7a5c"/>

        <!-- hocico: se traslapa con la cabeza para leerse pegado -->
        <path class="ink" d="M110 100 q26 0 26 18 q0 18 -26 18 q-26 0 -26 -18 q0 -18 26 -18 Z"
              fill="#fbf2e2"/>
        <ellipse cx="126" cy="112" rx="7.5" ry="5.5" fill="#4a4036" filter="url(#wobSoft)"/>
        <path class="thin" d="M120 124 q-7 7 -14 2 M120 124 q5 7 12 3"/>

        <!--
          Ojos corridos hacia la derecha para que la cara quede en tres cuartos
          y se lea que mira hacia donde está el pastel. El borde derecho del ojo
          queda en x=122.5 y la oreja caída arranca en x=130: no se tocan.
        -->
        <ellipse cx="90" cy="90" rx="5.5" ry="7" fill="#4a4036" filter="url(#wobSoft)"/>
        <ellipse cx="117" cy="88" rx="5.5" ry="7" fill="#4a4036" filter="url(#wobSoft)"/>
        <circle cx="89" cy="87" r="2" fill="#fbf2e2"/>
        <circle cx="116" cy="85" r="2" fill="#fbf2e2"/>
        <path class="thin" d="M82 76 q9 -5 16 -2 M111 74 q9 -4 15 0"/>

        <!-- mechones despeinados entre el gorro y la frente -->
        <g class="fur" stroke="#8a6b4e">
          <path d="M88 60 q2 -11 8 -16 M100 58 q0 -13 5 -18 M112 60 q4 -10 9 -14"/>
        </g>

        <!-- collar con placa, en la unión de cabeza y cuerpo -->
        <path class="ink" d="M68 136 q32 16 64 -2" stroke="#cf7f8c" stroke-width="5"/>
        <circle cx="100" cy="148" r="6" fill="#f2c45e" stroke="#4a4036"
                stroke-width="1.6" filter="url(#wobSoft)"/>

        <!-- gorro ladeado, apoyado sobre la cabeza -->
        <path class="ink" d="M76 54 L104 12 L128 58 Z" fill="#e7b9c4"/>
        <path class="thin" d="M82 42 q20 7 40 2 M90 28 q13 5 26 2" stroke="#cf94a2"/>
        <circle cx="104" cy="8" r="7" fill="#bcd3e6" stroke="#4a4036"
                stroke-width="1.6" filter="url(#wobSoft)"/>
      </g>
    </defs>
  </svg>

  <main class="page">
    <h1 class="sr-only" id="pageTitle">Feliz cumpleaños, Angeliux</h1>

    <button
      class="musicBtn"
      id="musicBtn"
      type="button"
      title="Reproducir la canción"
      aria-label="Reproducir la canción"
      aria-controls="musicPanel"
      aria-expanded="false"
      aria-pressed="false"
    >🎵</button>

    <!-- Rotulación delineada, en SVG para poder temblarla como la de a mano -->
    <svg class="banner" viewBox="0 0 400 118" aria-hidden="true" focusable="false">
      <g font-family="Trebuchet MS, Segoe UI, sans-serif" font-weight="800"
         letter-spacing="1" filter="url(#wob)">
        <text x="200" y="52" text-anchor="middle" font-size="44"
              fill="#f0d3d9" stroke="#8aa9c4" stroke-width="2.2">FELIZ</text>
        <text x="200" y="96" text-anchor="middle" font-size="29"
              fill="#dce9d6" stroke="#cf94a2" stroke-width="2">CUMPLEAÑOS</text>
      </g>
    </svg>

    <!--
      Dos <span> de bloque y no un salto de línea dentro del texto: textContent
      no interpreta saltos, el HTML colapsa los espacios y todo quedaría en un
      solo renglón.
    -->
    <p class="subtitle">
      <span class="subDate">· 5 de octubre ·</span>
      <span class="subNote">una fecha importante</span>
    </p>

    <!-- ===== Viñeta 1: el perrito saluda ===== -->
    <section class="panel" id="panel1" aria-labelledby="pageTitle">
      <svg viewBox="0 0 400 300" role="img"
           aria-label="Un perrito despeinado con gorro de fiesta, saludando">
        <rect width="400" height="300" fill="#f6ecd8" opacity="0.5"/>
        <rect width="400" height="300" filter="url(#grain)" opacity="0.12"
              style="mix-blend-mode:multiply"/>

        <g class="scrib" stroke="#8fb0cc">
          <path d="M34 196 q14 -46 54 -112 M58 206 q14 -46 54 -112
                   M300 196 q14 -46 54 -112 M326 206 q14 -46 54 -112"/>
        </g>
        <g class="scrib" stroke="#dba9b4" opacity="0.2">
          <path d="M250 150 q16 -36 56 -86"/>
        </g>

        <!-- El perrito definido una sola vez arriba, reutilizado aquí -->
        <use href="#dogArt" transform="translate(100 30)"/>

        <g class="scrib" stroke="#8fa878" opacity="0.45">

    <!--

        El div interno es el que YT.Player sustituye por su iframe, por eso va

        <div id="musicPlayer"></div>

        class="musicFallback"
        href="https://www.youtube.com/watch?v=cDT12zAWDuM"

        rel="noopener noreferrer"
      >Si no inicia, abrir la canción en YouTube ↗</a>

  <script>
    const chip = document.getElementById('chip');
    const panels = [1, 2, 3, 4].map((n) => document.getElementById(`panel${n}`));
    const cakeBtn = document.getElementById('cakeBtn');
    const cakeScene = document.getElementById('cakeScene');
    const candleBodies = document.getElementById('candleBodies');
    const candleFlames = document.getElementById('candleFlames');
    const candleSmoke = document.getElementById('candleSmoke');
    const cakeText = document.getElementById('cakeText');
    const cakeHint = document.getElementById('cakeHint');
    const finalText = document.getElementById('finalText');
    const photoCaption = document.getElementById('photoCaption');
    const dim = document.getElementById('dim');
    const confettiBox = document.getElementById('confetti');
    const musicBtn = document.getElementById('musicBtn');
    const musicPanel = document.getElementById('musicPanel');
    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

    /*
      Se usa YouTube y no Spotify: el embed de Spotify corta a los 30 segundos
      salvo que quien escuche tenga sesión Premium en ese mismo navegador.
    */
    const youtubeVideoId = 'cDT12zAWDuM';

    const birthYear = 1973;

    /*
      La edad se calcula sola para que la tarjeta no envejezca mal: es la que
      cumple en el año en que se abre. Si se abriera en 2027 diría 54 y pondría
      54 velitas, sin tocar nada.
    */
    const age = new Date().getFullYear() - birthYear;

    const svgNS = 'http://www.w3.org/2000/svg';

    /* Un deseo por soplo. El número de soplos sale de aquí. */
    const wishes = [
      'Que este año te sobre salud…',
      'y te falte tiempo para aburrirte.',
      'Que sigamos riéndonos de lo mismo sin tener que explicárselo a nadie…',
      'Que sientas en tu corazón la emoción de cumplir un año más...',
      'Celebra de lo bonito tu día.'
    ];

    let step = 0;
    let gust = 0;
    let candles = [];
    let allOut = false;

    function reducedMotion() {
      return motionQuery.matches;
    }

    function showPanel(index) {
      const panel = panels[index];
      panel.classList.add('show');
      /* Deja de ser inerte recién al aparecer, no antes. */
      panel.inert = false;
      window.setTimeout(() => {
        panel.scrollIntoView({
          behavior: reducedMotion() ? 'auto' : 'smooth',
          block: 'center'
        });
      }, reducedMotion() ? 0 : 260);
    }

    /* Dibuja una velita por año, repartidas en tres filas sobre el betún. */
    function buildCandles() {
      candleBodies.replaceChildren();
      candleFlames.replaceChildren();
      candleSmoke.replaceChildren();
      candles = [];

      const ceras = ['#e7b9c4', '#bcd3e6', '#cfe0bd', '#f2c45e', '#d8c3e4'];
      const rows = [
        { base: 196, height: 16, left: 196, right: 310 },
        { base: 188, height: 18, left: 192, right: 306 },
        { base: 180, height: 15, left: 198, right: 300 }
      ];

      const perRow = Math.ceil(age / rows.length);

      for (let i = 0; i < age; i += 1) {
        const row = rows[Math.min(Math.floor(i / perRow), rows.length - 1)];
        const indexInRow = i % perRow;
        const span = row.right - row.left;
        const x = row.left + (span * indexInRow) / Math.max(1, perRow - 1);
        const top = row.base - row.height;

        const wax = document.createElementNS(svgNS, 'rect');
        wax.setAttribute('x', (x - 1.8).toFixed(1));
        wax.setAttribute('y', top.toFixed(1));
        wax.setAttribute('width', '3.6');
        wax.setAttribute('height', String(row.height));
        wax.setAttribute('fill', ceras[i % ceras.length]);
        wax.setAttribute('stroke', '#4a4036');
        wax.setAttribute('stroke-width', '1.2');
        candleBodies.appendChild(wax);

        const flame = document.createElementNS(svgNS, 'ellipse');
        flame.setAttribute('class', 'flame');
        flame.setAttribute('cx', x.toFixed(1));
        flame.setAttribute('cy', (top - 5).toFixed(1));
        flame.setAttribute('rx', '2.6');
        flame.setAttribute('ry', '4.6');
        flame.setAttribute('fill', '#f2c45e');
        flame.setAttribute('stroke', '#c99a3e');
        flame.setAttribute('stroke-width', '1');
        /* Desfase para que no titilen todas al mismo tiempo */
        flame.style.animationDelay = `${(i % 9) * 0.09}s`;
        candleFlames.appendChild(flame);

        const smoke = document.createElementNS(svgNS, 'ellipse');
        smoke.setAttribute('class', 'smoke');
        smoke.setAttribute('cx', x.toFixed(1));
        smoke.setAttribute('cy', (top - 7).toFixed(1));
        smoke.setAttribute('rx', '2.4');
        smoke.setAttribute('ry', '3.4');
        smoke.setAttribute('fill', '#b5aa96');
        candleSmoke.appendChild(smoke);

        candles.push({ flame, smoke, out: false });
      }
    }

    function litCandles() {
      return candles.filter((candle) => !candle.out);
    }

    function updateCakeHint() {
      const left = litCandles().length;

      if (left === 0) {
        cakeHint.textContent = '';
        return;
      }

      cakeHint.textContent = left === 1
        ? 'queda una · toca para soplar'
        : `quedan ${left} · toca para soplar`;
    }

    function blow() {
      if (allOut) {
        return;
      }

      /* El perrito infla cachetes y suelta el chorro de aire */
      cakeScene.classList.add('blowing');
      window.setTimeout(() => cakeScene.classList.remove('blowing'), 520);

      const lit = litCandles();
      const gustsLeft = wishes.length - gust;
      const howMany = Math.ceil(lit.length / Math.max(1, gustsLeft));

      /* Se apagan en desorden para que parezca un soplo y no una secuencia. */
      for (let i = lit.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [lit[i], lit[j]] = [lit[j], lit[i]];
      }

      lit.slice(0, howMany).forEach((candle) => {
        candle.out = true;
        candle.flame.style.opacity = '0';
        candle.flame.style.animation = 'none';
        candle.smoke.style.animation = 'puff 1.1s ease-out forwards';
      });

      cakeText.textContent = wishes[gust];
      gust += 1;
      updateCakeHint();

      if (litCandles().length > 0) {
        return;
      }

      allOut = true;
      cakeBtn.disabled = true;
      cakeBtn.setAttribute('aria-label', 'Velitas apagadas');
      celebrate();
    }

    function celebrate() {
      dim.classList.add('on');
      launchConfetti();

      window.setTimeout(() => {
        dim.classList.remove('on');
        finalText.textContent = `¡Felices ${age}, angeliux! Disfruta mucho tu cumple, te mando un abrazote  ¡Happy Birthday! 🎂`;
        showPanel(2);
        chip.textContent = 'Pero espera, sht sht, hay algo más… 🍰😘';
        chip.classList.remove('hidden');
        step = 3;
      }, reducedMotion() ? 0 : 1500);
    }

    function launchConfetti() {
      if (reducedMotion()) {
        return;
      }

      const colores = ['#e7b9c4', '#bcd3e6', '#cfe0bd', '#f2c45e', '#d8c3e4'];

      for (let i = 0; i < 70; i += 1) {
        const bit = document.createElement('div');
        bit.className = 'bit';
        bit.style.left = `${Math.random() * 100}%`;
        bit.style.background = colores[i % colores.length];
        bit.style.setProperty('--drift', `${Math.random() * 180 - 90}px`);
        bit.style.setProperty('--spin', `${Math.random() * 900 - 450}deg`);
        bit.style.setProperty('--time', `${2.6 + Math.random() * 2.2}s`);
        bit.style.animationDelay = `${Math.random() * 0.7}s`;
        bit.addEventListener('animationend', () => bit.remove(), { once: true });
        confettiBox.appendChild(bit);
      }
    }

    function onChip() {
      /* Paso 0: arranca la música y muestra el pastel. */
      if (step === 0) {
        if (!musicPlaying && !musicManuallyPaused) {
          requestMusicPlayback();
        }

        buildCandles();
        cakeText.textContent = `…ayudarte a apagar ${age} velitas. Sí, las conté una por una.`;
        updateCakeHint();
        showPanel(1);
        chip.classList.add('hidden');
        step = 1;
        return;
      }

      /* Paso 3: la foto y el cierre. */
      if (step === 3) {
        photoCaption.textContent = 'Misión cumplida. El pastel ya tiene dueño. Espero no hayas olvidado pedir un gran deseo al soplar las velitas. 😘';
        showPanel(3);
        chip.textContent = 'Leer otra vez ↺';
        step = 4;
        return;
      }

      if (step === 4) {
        restart();
      }
    }

    function restart() {
      step = 0;
      gust = 0;
      allOut = false;

      panels.forEach((panel, index) => {
        if (index > 0) {
          panel.classList.remove('show');
          panel.inert = true;
        }
      });

      candleBodies.replaceChildren();
      candleFlames.replaceChildren();
      candleSmoke.replaceChildren();
      candles = [];
      confettiBox.replaceChildren();
      cakeText.textContent = '';
      cakeHint.textContent = '';
      finalText.textContent = '';
      photoCaption.textContent = '';
      cakeBtn.disabled = false;
      cakeBtn.setAttribute('aria-label', 'Soplar las velitas');

      chip.textContent = 'Seguir leyendo →';
      chip.classList.remove('hidden');
      panels[0].scrollIntoView({
        behavior: reducedMotion() ? 'auto' : 'smooth',
        block: 'center'
      });
    }

    /* ---------- Reproductor de YouTube ---------- */
    let musicPlayer = null;
    let musicReady = false;
    let musicPlaying = false;
    let musicPlaybackRequested = false;
    let musicManuallyPaused = false;
    let musicPanelHideTimer = null;

    function clearMusicPanelHideTimer() {
      if (musicPanelHideTimer !== null) {
        window.clearTimeout(musicPanelHideTimer);
        musicPanelHideTimer = null;
      }
    }

    function showMusicPanel() {
      clearMusicPanelHideTimer();
      musicPanel.classList.add('show');
      musicPanel.setAttribute('aria-hidden', 'false');
      musicPanel.inert = false;
      musicBtn.setAttribute('aria-expanded', 'true');
    }

    function hideMusicPanel() {
      clearMusicPanelHideTimer();
      musicPanel.classList.remove('show');
      musicPanel.setAttribute('aria-hidden', 'true');
      musicPanel.inert = true;
      musicBtn.setAttribute('aria-expanded', 'false');
    }

    function scheduleMusicPanelHide() {
      if (!musicPanel.classList.contains('show') || musicPanelHideTimer !== null) {
        return;
      }

      /*
        Se espera 7 segundos antes de esconder el reproductor, no medio segundo.
        YouTube puede meter un anuncio antes de la canción y la API no avisa
        cuándo es anuncio y cuándo es el video. Si el panel se cerrara de
        inmediato, se oiría el anuncio sin ver el botón de saltarlo.
      */
      musicPanelHideTimer = window.setTimeout(() => {
        musicPanelHideTimer = null;
        if (musicPlaying) {
          hideMusicPanel();
        }
      }, 7000);
    }

    function updateMusicButton() {
      musicBtn.textContent = musicPlaying ? '⏸' : '🎵';
      musicBtn.classList.toggle('playing', musicPlaying);
      musicBtn.setAttribute('aria-pressed', String(musicPlaying));
      const label = musicPlaying ? 'Pausar la canción' : 'Reproducir la canción';
      musicBtn.setAttribute('aria-label', label);
      musicBtn.title = label;
    }

    function requestMusicPlayback() {
      showMusicPanel();
      musicPlaybackRequested = true;

      if (musicPlayer && musicReady) {
        try {
          musicPlayer.playVideo();
        } catch (error) {
          /* El reproductor visible permite iniciarla a mano. */
        }
      }
    }

    function toggleMusicPlayback() {
      if (!musicPlayer || !musicReady) {
        showMusicPanel();
        musicManuallyPaused = false;
        musicPlaybackRequested = true;
        return;
      }

      try {
        if (musicPlaying) {
          clearMusicPanelHideTimer();
          musicManuallyPaused = true;
          musicPlaybackRequested = false;
          musicPlaying = false;
          updateMusicButton();
          musicPlayer.pauseVideo();
        } else {
          musicManuallyPaused = false;
          musicPlaybackRequested = true;
          musicPlayer.playVideo();
        }
      } catch (error) {
        showMusicPanel();
      }
    }

    window.onYouTubeIframeAPIReady = () => {
      const playerVars = {
        playsinline: 1,
        controls: 1,
        rel: 0,
        modestbranding: 1,
        loop: 1,
        playlist: youtubeVideoId
      };

      /* YouTube rechaza orígenes que son una IP literal, y con file:// no hay. */
      if (window.location.protocol.startsWith('http')) {
        playerVars.origin = window.location.origin;
      }

      musicPlayer = new YT.Player('musicPlayer', {
        videoId: youtubeVideoId,
        playerVars,
        events: {
          onReady: () => {
            musicReady = true;
            if (musicPlaybackRequested && !musicManuallyPaused) {
              try {
                musicPlayer.playVideo();
              } catch (error) {
                /* El reproductor visible funciona como respaldo. */
              }
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              musicPlaying = true;
              musicPlaybackRequested = false;
              updateMusicButton();
              scheduleMusicPanelHide();
              return;
            }

            if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
              musicPlaying = false;
              clearMusicPanelHideTimer();
              updateMusicButton();
            }
          },
          onError: (event) => {
            /*
              101 y 150: el dueño no permite incrustarlo, hay que cambiar de video.
              100: no existe o es privado. 2: id mal escrito. 5: fallo del player.
            */
            const causes = {
              2: 'id de video inválido',
              5: 'error del reproductor HTML5',
              100: 'video no encontrado o privado',
              101: 'el dueño no permite incrustarlo',
              150: 'el dueño no permite incrustarlo'
            };
            const code = event?.data;
            console.warn(`YouTube no pudo reproducir (código ${code}): ${causes[code] ?? 'causa desconocida'}`);
            showMusicPanel();
          }
        }
      });
    };

    /* ---------- Arranque ---------- */
    panels[0].classList.add('show');

    chip.addEventListener('click', onChip);
    cakeBtn.addEventListener('click', blow);
    musicBtn.addEventListener('click', toggleMusicPlayback);
  </script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
