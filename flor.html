<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Título y descripción a propósito neutros: son lo que WhatsApp muestra
    en la vista previa del enlace, así que no deben revelar la sorpresa.
  -->
  <meta name="description" content="Ábrelo cuando puedas.">
  <meta name="theme-color" content="#b9dcf5">
  <title>Para ti 💙</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-x: hidden;
      background: #eef5fa;
      color: #17324d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.music-open {
      align-items: flex-start;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .wrap {
      position: relative;
      width: min(100%, 520px);
      text-align: center;
    }

    .scene {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 600px;
      height: clamp(560px, calc(100dvh - 138px), 600px);
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 30px;
      background: linear-gradient(180deg, #b9dcf5 0%, #eaf6fc 57%, #d8c2a5 57%, #a77d59 100%);
      box-shadow: 0 12px 35px rgba(50, 70, 90, 0.16);
    }

    .sky {
      position: absolute;
      inset: 0 0 43%;
      background:
        radial-gradient(circle at 75% 22%, rgba(255, 255, 255, 0.7) 0 3px, transparent 4px),
        radial-gradient(circle at 20% 32%, rgba(255, 255, 255, 0.55) 0 2px, transparent 3px);
    }

    /*
      Pétalos que caen y se quedan.

      A diferencia de las partículas que suben y desaparecen, estos aterrizan:
      al terminar la caída el JS los convierte en un pétalo en reposo dentro de
      .fallen, así la escena acumula rastro y al final no se ve como al inicio.
      La distancia de caída la calcula el JS desde la altura real de la escena,
      porque .scene usa clamp() y no es un valor fijo.
    */
    .petalsLayer {
      position: absolute;
      z-index: 8;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .fallingPetal {
      position: absolute;
      top: -28px;
      width: 15px;
      height: 21px;
      border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
      background: linear-gradient(180deg, #e2f1fd 0%, #a9d0f2 55%, #6d9ccd 100%);
      box-shadow: inset 0 -3px 5px rgba(38, 72, 116, 0.22);
      opacity: 0;
      animation: petal-fall var(--fall-time, 7s) linear forwards;
    }

    /* El pétalo arrancado cae más grande, porque viene de la flor y no del aire. */
    .fallingPetal.plucked {
      width: 26px;
      height: 38px;
    }

    @keyframes petal-fall {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(0deg);
      }
      7% {
        opacity: 0.95;
      }
      100% {
        opacity: 0.9;
        transform:
          translate(var(--drift, 20px), var(--fall-distance, 480px))
          rotate(var(--spin, 300deg));
      }
    }

    /* Montón en el suelo: vistos desde arriba quedan achatados. */
    /*
      Se apoya en la línea de la tierra: .ground ocupa 155px con bottom -35px,
      así que su borde visible queda a 120px del fondo de la escena. El montón
      se coloca justo ahí para que el pétalo no salte al aterrizar.
    */
    .fallen {
      position: absolute;
      z-index: 3;
      bottom: 104px;
      left: 0;
      width: 100%;
      height: 28px;
      pointer-events: none;
    }

    .restingPetal {
      position: absolute;
      bottom: 0;
      width: 17px;
      height: 11px;
      border-radius: 50%;
      background: linear-gradient(180deg, #d4e7f8 0%, #8fb4dc 70%, #6b93c4 100%);
      box-shadow: 0 1px 2px rgba(48, 74, 104, 0.22);
      opacity: 0;
      transform: rotate(var(--lie, 0deg)) scale(0.5);
      animation: petal-land 0.45s ease-out forwards;
    }

    @keyframes petal-land {
      to {
        opacity: 0.92;
        transform: rotate(var(--lie, 0deg)) scale(1);
      }
    }

    /* Reproductor de música */
    .musicBtn {
      position: absolute;
      z-index: 20;
      top: 14px;
      right: 14px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: #17324d;
      box-shadow: 0 4px 12px rgba(50, 70, 90, 0.2);
      cursor: pointer;
      font-size: 18px;
      transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .musicBtn:hover {
      background: #fff;
      box-shadow: 0 6px 16px rgba(50, 70, 90, 0.26);
      transform: translateY(-1px);
    }

    .musicBtn:active {
      transform: translateY(0) scale(0.96);
    }

    .musicBtn.playing {
      background: #dff1ff;
      color: #285f97;
      animation: music-pulse 2.4s ease-in-out infinite;
    }

    @keyframes music-pulse {
      0%, 100% {
        box-shadow: 0 4px 12px rgba(50, 70, 90, 0.2), 0 0 0 0 rgba(77, 131, 195, 0.28);
      }
      50% {
        box-shadow: 0 6px 18px rgba(50, 70, 90, 0.24), 0 0 0 8px rgba(77, 131, 195, 0);
      }
    }

    .musicPanel {
      width: 100%;
      max-height: 0;
      margin-top: 0;
      visibility: hidden;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      transition:
        max-height 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
        margin-top 0.5s ease,
        opacity 0.35s ease,
        transform 0.5s ease,
        visibility 0s linear 0.5s;
    }

    .musicPanel.show {
      max-height: 280px;
      margin-top: 12px;
      visibility: visible;
      opacity: 1;
      transform: none;
      transition-delay: 0s;
    }

    .musicEmbed {
      position: relative;
      aspect-ratio: 16 / 9;
      max-height: 240px;
      overflow: hidden;
      border-radius: 12px;
      background: #121212;
      color: #fff;
      box-shadow: 0 8px 24px rgba(20, 40, 60, 0.2);
    }

    /* Aviso de carga: el iframe lo tapa al montarse encima. */
    .musicEmbed::before {
      content: "Cargando la canción…";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    .musicEmbed > * {
      position: relative;
      z-index: 1;
    }

    .musicPanel iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 12px;
    }

    .musicFallback {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      margin-top: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      color: #315d82;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .musicFallback:hover {
      background: rgba(77, 131, 195, 0.1);
    }

    .musicFallback:focus-visible {
      outline: 3px solid #17324d;
      outline-offset: 2px;
    }

    .text {
      position: absolute;
      z-index: 10;
      top: 52px;
      right: 28px;
      left: 28px;
      min-height: 100px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      font-size: clamp(1.15rem, 5vw, 1.55rem);
      font-weight: 700;
      line-height: 1.3;
      transform: translateY(12px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }

    .text.show {
      opacity: 1;
      transform: none;
    }

    .ground {
      position: absolute;
      bottom: -35px;
      left: -8%;
      width: 116%;
      height: 155px;
      border-radius: 50% 50% 0 0 / 30% 30% 0 0;
      background: radial-gradient(ellipse at center, #b18a65 0%, #896344 70%);
    }

    .seed {
      position: absolute;
      z-index: 6;
      bottom: 70px;
      left: 50%;
      width: 24px;
      height: 15px;
      border-radius: 72% 28% 68% 32%;
      opacity: 0;
      background: linear-gradient(145deg, #b98550 0%, #714725 72%);
      box-shadow:
        inset 4px 3px 5px rgba(255, 255, 255, 0.2),
        0 4px 8px rgba(66, 42, 24, 0.28);
      transform: translateX(-50%) translateY(8px) rotate(-18deg) scale(0.35);
      transform-origin: center;
      transition: opacity 0.55s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .seed::after {
      content: "";
      position: absolute;
      inset: -8px;
      border: 2px solid rgba(242, 212, 119, 0.55);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.45);
      pointer-events: none;
    }

    .seed.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) rotate(-18deg) scale(1);
      animation: seed-awaken 1.8s ease-in-out 0.7s infinite;
    }

    .seed.show::after {
      animation: seed-glow 1.8s ease-out 0.7s infinite;
    }

    .seed.sprouting {
      opacity: 0;
      animation: none;
      transform: translateX(-50%) translateY(-11px) rotate(-8deg) scale(0.7);
    }

    @keyframes seed-awaken {
      0%, 100% {
        transform: translateX(-50%) translateY(0) rotate(-18deg) scale(1);
      }
      50% {
        transform: translateX(-50%) translateY(-4px) rotate(-10deg) scale(1.06);
      }
    }

    @keyframes seed-glow {
      0% {
        opacity: 0;
        transform: scale(0.45);
      }
      35% {
        opacity: 0.65;
      }
      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    .stem {
      position: absolute;
      z-index: 4;
      bottom: 78px;
      left: 50%;
      width: 9px;
      height: 0;
      border-radius: 10px;
      background: #57916a;
      transform: translateX(-50%);
      transition: height 1.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .leaf {
      position: absolute;
      z-index: 5;
      width: 72px;
      height: 34px;
      border-radius: 100% 0 100% 0;
      opacity: 0;
      background: #649b70;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .leaf.l {
      bottom: 190px;
      left: calc(50% - 67px);
      transform: rotate(-24deg) scale(0.5);
    }

    .leaf.r {
      bottom: 235px;
      left: calc(50% + 2px);
      transform: scaleX(-1) rotate(-24deg) scale(0.5);
    }

    .leaf.show {
      opacity: 1;
      transform: rotate(-24deg) scale(1);
    }

    .leaf.r.show {
      transform: scaleX(-1) rotate(-24deg) scale(1);
    }

    .flower {
      position: absolute;
      z-index: 7;
      top: 28.333%;
      left: 50%;
      width: 145px;
      height: 145px;
      opacity: 0;
      filter: drop-shadow(0 7px 10px rgba(44, 78, 118, 0.26));
      transform: translateX(-50%) scale(0.05);
      transition: opacity 0.9s ease, transform 1.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .flower.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Flores secundarias que forman el ramo */
    .bouquet {
      position: absolute;
      z-index: 6;
      inset: 0;
      pointer-events: none;
    }

    /* Césped que brota cuando el ramo termina de formarse */
    .bouquet::before,
    .bouquet::after {
      content: "";
      position: absolute;
      z-index: 0;
      bottom: 57px;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 3px 2px rgba(48, 83, 48, 0.18));
      transform: translateY(8px) scaleY(0.12);
      transform-origin: 50% 100%;
      transition: opacity 0.75s ease, transform 1s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .bouquet::before {
      left: 4%;
      width: 92%;
      height: 48px;
      background:
        linear-gradient(72deg, transparent 46%, #477d55 47% 53%, transparent 54%) 0 100% / 12% 72% repeat-x,
        linear-gradient(108deg, transparent 46%, #6aa176 47% 53%, transparent 54%) 6% 100% / 12% 92% repeat-x,
        linear-gradient(90deg, transparent 46%, #3f744d 47% 53%, transparent 54%) 3% 100% / 10% 58% repeat-x;
    }

    .bouquet::after {
      bottom: 60px;
      left: 13%;
      width: 74%;
      height: 35px;
      background:
        linear-gradient(66deg, transparent 46%, #5a9367 47% 53%, transparent 54%) 0 100% / 15% 78% repeat-x,
        linear-gradient(114deg, transparent 46%, #76aa7f 47% 53%, transparent 54%) 7.5% 100% / 15% 100% repeat-x;
    }

    .bouquet.show::before,
    .bouquet.show::after {
      opacity: 0.92;
      transform: translateY(0) scaleY(1);
    }

    .bouquet.show::before {
      transition-delay: 2s;
    }

    .bouquet.show::after {
      transition-delay: 2.25s;
    }

    .bouquetBranch {
      --angle: 0deg;
      --height: 240px;
      --stem-delay: 0s;
      --leaf-delay: 0.55s;
      --bloom-delay: 0.95s;
      position: absolute;
      z-index: 1;
      bottom: 78px;
      left: 50%;
      width: 7px;
      height: var(--height);
      border-radius: 999px;
      opacity: 0;
      background: linear-gradient(90deg, #4f8a63, #67a177);
      box-shadow: inset 1px 0 rgba(255, 255, 255, 0.22);
      transform: translateX(-50%) rotate(var(--angle)) scaleY(0);
      transform-origin: 50% 100%;
      transition: opacity 0.25s ease, transform 1.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .bouquet.show .bouquetBranch {
      opacity: 1;
      transform: translateX(-50%) rotate(var(--angle)) scaleY(1);
      transition-delay: var(--stem-delay);
    }

    .bouquetBranch.b1 {
      --angle: -32deg;
      --height: 235px;
      --stem-delay: 0s;
      --leaf-delay: 0.55s;
      --bloom-delay: 0.95s;
    }

    .bouquetBranch.b2 {
      --angle: -16deg;
      --height: 285px;
      --stem-delay: 0.14s;
      --leaf-delay: 0.72s;
      --bloom-delay: 1.08s;
    }

    .bouquetBranch.b3 {
      --angle: 17deg;
      --height: 275px;
      --stem-delay: 0.28s;
      --leaf-delay: 0.88s;
      --bloom-delay: 1.2s;
    }

    .bouquetBranch.b4 {
      --angle: 32deg;
      --height: 235px;
      --stem-delay: 0.42s;
      --leaf-delay: 1.02s;
      --bloom-delay: 1.34s;
    }

    .bouquetLeaf {
      position: absolute;
      top: 52%;
      width: 46px;
      height: 22px;
      border-radius: 100% 0 100% 0;
      opacity: 0;
      background: #649b70;
      transition: opacity 0.55s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .bouquetLeaf.to-left {
      right: 2px;
      transform: rotate(-28deg) scale(0.25);
      transform-origin: 100% 50%;
    }

    .bouquetLeaf.to-right {
      left: 2px;
      transform: scaleX(-1) rotate(-28deg) scale(0.25);
      transform-origin: 0 50%;
    }

    .bouquet.show .bouquetLeaf.to-left {
      opacity: 1;
      transform: rotate(-28deg) scale(1);
      transition-delay: var(--leaf-delay);
    }

    .bouquet.show .bouquetLeaf.to-right {
      opacity: 1;
      transform: scaleX(-1) rotate(-28deg) scale(1);
      transition-delay: var(--leaf-delay);
    }

    .bouquetHead {
      position: absolute;
      top: 0;
      left: 50%;
      width: 96px;
      height: 96px;
      opacity: 0;
      filter: drop-shadow(0 5px 7px rgba(54, 91, 130, 0.2));
      transform: translate(-50%, -50%) scale(0.05);
      transition: opacity 0.65s ease, transform 1.05s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .bouquet.show .bouquetHead {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      transition-delay: var(--bloom-delay);
    }

    /*
      Pétalos. El transform los ancla con transform-origin: 50% 100%, así que la
      base queda en el centro de la flor y la punta apunta hacia afuera. De ahí
      salen dos decisiones:
        - El degradado va claro en la punta y oscuro en la base, que es como cae
          la luz en un pétalo real (antes era un degradado diagonal plano).
        - El border-radius es asimétrico en los dos ejes para que se angoste en
          la base y se ensanche redondeado en la punta, en vez de ser un óvalo.

      Las coronas traseras (.back) van ANTES en el marcado, no con z-index: cada
      pétalo tiene transform y eso crea un contexto de apilamiento propio, así
      que un z-index negativo quedaría encima y no detrás. El orden del DOM es
      lo único que funciona aquí.
    */
    .bouquetPetal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 37px;
      height: 58px;
      border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
      background:
        radial-gradient(ellipse 72% 46% at 50% 15%, rgba(255, 255, 255, 0.55), transparent 72%),
        linear-gradient(180deg, #e4f2fd 0%, #b8dbf8 34%, #78aadc 72%, #4d7fb6 100%);
      box-shadow:
        inset 0 -6px 9px rgba(38, 72, 116, 0.3),
        0 1px 3px rgba(32, 60, 96, 0.16);
      transform-origin: 50% 100%;
    }

    /* Nervadura central del pétalo. */
    .bouquetPetal::after,
    .petal::after {
      content: "";
      position: absolute;
      top: 17%;
      bottom: 8%;
      left: 50%;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
      transform: translateX(-50%);
    }

    .bouquetPetal::after {
      width: 1.5px;
    }

    .bouquetPetal.back {
      background: linear-gradient(180deg, #bedaf3 0%, #7ba3cf 58%, #46739f 100%);
      box-shadow: none;
    }

    .bouquetPetal.back::after {
      display: none;
    }

    .bp1 { transform: translate(-50%, -100%) rotate(0deg); }
    .bp2 { transform: translate(-50%, -100%) rotate(72deg); }
    .bp3 { transform: translate(-50%, -100%) rotate(144deg); }
    .bp4 { transform: translate(-50%, -100%) rotate(216deg); }
    .bp5 { transform: translate(-50%, -100%) rotate(288deg); }

    /* Corona trasera: desfasada 36° para asomar justo en los huecos. */
    .bpb1 { transform: translate(-50%, -100%) rotate(36deg) scale(0.9); }
    .bpb2 { transform: translate(-50%, -100%) rotate(108deg) scale(0.9); }
    .bpb3 { transform: translate(-50%, -100%) rotate(180deg) scale(0.9); }
    .bpb4 { transform: translate(-50%, -100%) rotate(252deg) scale(0.9); }
    .bpb5 { transform: translate(-50%, -100%) rotate(324deg) scale(0.9); }

    .bouquetCenter {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(170, 120, 22, 0.5) 0 1.1px, transparent 1.6px) 0 0 / 5.5px 5.5px,
        radial-gradient(circle at 36% 32%, #fff4cd 0%, #f6dc8a 38%, #e4b945 72%, #bd8f26 100%);
      box-shadow:
        inset 0 -3px 5px rgba(140, 100, 18, 0.42),
        inset 0 2px 4px rgba(255, 255, 255, 0.5),
        0 0 0 2px rgba(255, 255, 255, 0.28),
        0 2px 5px rgba(36, 66, 104, 0.3);
      transform: translate(-50%, -50%);
    }

    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 86px;
      border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
      background:
        radial-gradient(ellipse 72% 48% at 50% 16%, rgba(255, 255, 255, 0.6), transparent 72%),
        linear-gradient(180deg, #e2f1fd 0%, #b2d8f7 34%, #74a7da 72%, #4a7cb4 100%);
      box-shadow:
        inset 0 -8px 12px rgba(38, 72, 116, 0.32),
        0 2px 5px rgba(32, 60, 96, 0.16);
      transform-origin: 50% 100%;
    }

    .petal::after {
      width: 2px;
    }

    .petal.back {
      background: linear-gradient(180deg, #bcd9f2 0%, #7ba3cf 58%, #44719f 100%);
      box-shadow: none;
    }

    .petal.back::after {
      display: none;
    }

    .p1 { transform: translate(-50%, -100%) rotate(0deg); }
    .p2 { transform: translate(-50%, -100%) rotate(72deg); }
    .p3 { transform: translate(-50%, -100%) rotate(144deg); }
    .p4 { transform: translate(-50%, -100%) rotate(216deg); }
    .p5 { transform: translate(-50%, -100%) rotate(288deg); }

    .pb1 { transform: translate(-50%, -100%) rotate(36deg) scale(0.9); }
    .pb2 { transform: translate(-50%, -100%) rotate(108deg) scale(0.9); }
    .pb3 { transform: translate(-50%, -100%) rotate(180deg) scale(0.9); }
    .pb4 { transform: translate(-50%, -100%) rotate(252deg) scale(0.9); }
    .pb5 { transform: translate(-50%, -100%) rotate(324deg) scale(0.9); }

    /*
      Centro: un disco cálido con puntitos repetidos que leen como estambres,
      más sombra interior abajo para que se hunda entre los pétalos y un aro
      blanco tenue que lo separa de ellos. Antes era un círculo amarillo plano.
    */
    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 37px;
      height: 37px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(176, 124, 24, 0.55) 0 1.4px, transparent 1.9px) 0 0 / 7px 7px,
        radial-gradient(circle at 36% 32%, #fff4cd 0%, #f6dc8a 38%, #e4b945 72%, #bd8f26 100%);
      box-shadow:
        inset 0 -4px 7px rgba(140, 100, 18, 0.45),
        inset 0 3px 6px rgba(255, 255, 255, 0.55),
        0 0 0 3px rgba(255, 255, 255, 0.3),
        0 3px 8px rgba(36, 66, 104, 0.32);
      /* No debe robarle el clic a los pétalos, que sí son botones. */
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    /*
      Deshojar la margarita.

      Los 5 pétalos delanteros son <button> de verdad, no divs con onclick: así
      funcionan con teclado y lector de pantalla sin trabajo extra. Miden 56x86,
      muy por encima del mínimo de 44px para el dedo.
    */
    .petal:not(.back) {
      padding: 0;
      border: 0;
      /* El prefijo es para Safari de iOS anterior a 15.4, que ignora el estándar. */
      -webkit-appearance: none;
      appearance: none;
      cursor: default;
      transition: opacity 0.35s ease;
    }

    .petal.back {
      pointer-events: none;
    }

    .flower.pluckable .petal:not(.back) {
      cursor: pointer;
      /*
        La invitación va por filter y NO por transform: el transform ya lo ocupan
        .p1-.p5 para colocar y rotar cada pétalo, y animarlo aquí lo rompería.
      */
      animation: petal-invite 2.3s ease-in-out infinite;
    }

    @keyframes petal-invite {
      0%, 100% {
        filter: brightness(1);
      }
      50% {
        filter: brightness(1.13) saturate(1.06);
      }
    }

    .petal.plucked {
      opacity: 0;
      pointer-events: none;
      animation: none;
    }

    .petal:not(.back):focus-visible {
      outline: 3px solid #17324d;
      outline-offset: 2px;
    }

    /* Pista para que se entienda que los pétalos se tocan. */
    .hint {
      position: absolute;
      z-index: 12;
      bottom: 16px;
      left: 50%;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      color: #2b5676;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      box-shadow: 0 3px 10px rgba(40, 70, 100, 0.18);
      transform: translateX(-50%) translateY(10px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .hint.show {
      opacity: 1;
      transform: translateX(-50%);
    }

    /* Durante el deshojado el botón se esconde sin alterar el alto del layout. */
    .button.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .final {
      position: absolute;
      z-index: 11;
      top: 82px;
      right: 25px;
      left: 25px;
      margin: 0;
      opacity: 0;
      color: #28485e;
      font-size: clamp(1.1rem, 4.5vw, 1.3rem);
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      text-shadow: 0 1px 5px rgba(255, 255, 255, 0.8);
      transform: translateY(10px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .final.show {
      opacity: 1;
      transform: none;
    }

    /* Collage final */
    .photoWrap {
      position: absolute;
      z-index: 15;
      inset: 0;
      visibility: hidden;
      padding: clamp(20px, 5vw, 30px) clamp(16px, 4.5vw, 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(180deg, #cfe6f7, #eaf6fc 55%, #d8c2a5 55%, #a77d59);
      transition: opacity 0.7s ease, visibility 0s linear 0.7s;
    }

    .photoWrap.show {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition-delay: 0s;
    }

    /*
      Álbum de flores secas, en lugar de la polaroid. Es otra metáfora física
      para la misma foto: papel envejecido, esquineros de cartón que la sujetan
      y una flor prensada al lado.
    */
    .album {
      position: relative;
      width: min(90%, 420px);
      padding: 16px 16px 14px;
      border-radius: 3px;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(188, 158, 108, 0.16), transparent 58%),
        radial-gradient(ellipse at 82% 88%, rgba(168, 138, 94, 0.14), transparent 58%),
        linear-gradient(170deg, #fdf7e8 0%, #f5ead2 100%);
      box-shadow:
        inset 0 0 0 1px rgba(150, 120, 80, 0.22),
        0 14px 34px rgba(40, 60, 80, 0.3);
      transform: rotate(-1.5deg) scale(0.9);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .photoWrap.show .album {
      transform: rotate(-1.5deg) scale(1);
    }

    .albumPhoto {
      position: relative;
      padding: 7px;
      background: rgba(255, 255, 255, 0.55);
    }

    .album img {
      display: block;
      width: 100%;
      max-height: min(272px, 41dvh);
      background: #e6ddc8;
      object-fit: contain;
    }

    .photoFallback {
      min-height: 200px;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #e6ddc8;
      color: #7a6245;
      font-size: 14px;
      line-height: 1.5;
    }

    .photoFallback[hidden] {
      display: none;
    }

    /* Esquineros de cartón que sujetan la foto. */
    .corner {
      position: absolute;
      z-index: 2;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, rgba(104, 76, 44, 0.5), rgba(104, 76, 44, 0.26));
    }

    .corner.tl {
      top: 0;
      left: 0;
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .corner.tr {
      top: 0;
      right: 0;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
    }

    .corner.bl {
      bottom: 0;
      left: 0;
      clip-path: polygon(0 0, 0 100%, 100% 100%);
    }

    .corner.br {
      bottom: 0;
      right: 0;
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }

    .albumFoot {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      margin-top: 11px;
    }

    /*
      Manuscrita del sistema. Depende de las fuentes instaladas en el equipo de
      quien abra la página; si no hay ninguna, cae en la cursiva genérica.
    */
    .albumCap,
    .albumDate {
      margin: 0;
      color: #5d4836;
      font-family: "Segoe Script", "Bradley Hand", "Snell Roundhand", cursive;
      line-height: 1.35;
      text-align: left;
    }

    .albumCap {
      font-size: 15px;
    }

    .albumDate {
      flex: none;
      font-size: 13px;
      opacity: 0.75;
    }

    /* Flor prensada: aplanada, sin brillos y con el azul apagado por los años. */
    .pressed {
      position: absolute;
      right: 12px;
      bottom: 8px;
      width: 46px;
      height: 46px;
      opacity: 0.72;
      transform: rotate(14deg);
    }

    .pressedPetal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 23px;
      border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
      background: linear-gradient(180deg, #b8c9d8 0%, #8ca3b8 100%);
      transform-origin: 50% 100%;
      mix-blend-mode: multiply;
    }

    .pp1 { transform: translate(-50%, -100%) rotate(0deg); }
    .pp2 { transform: translate(-50%, -100%) rotate(72deg); }
    .pp3 { transform: translate(-50%, -100%) rotate(144deg); }
    .pp4 { transform: translate(-50%, -100%) rotate(216deg); }
    .pp5 { transform: translate(-50%, -100%) rotate(288deg); }

    .pressedCore {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #b59a62;
      transform: translate(-50%, -50%);
    }

    .photoWrap .msg {
      margin: 16px 0 0;
      color: #28485e;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.4;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.7);
    }

    .button {
      min-height: 48px;
      margin-top: 17px;
      padding: 13px 25px;
      border: 0;
      border-radius: 999px;
      background: #356da8;
      color: #fff;
      box-shadow: 0 6px 18px rgba(53, 109, 168, 0.3);
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .button:hover:not(:disabled) {
      background: #2d5f93;
      box-shadow: 0 8px 22px rgba(45, 95, 147, 0.34);
      transform: translateY(-1px);
    }

    .button:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    .button:disabled {
      opacity: 0.72;
      cursor: wait;
    }

    .button:focus-visible,
    .musicBtn:focus-visible {
      outline: 3px solid #17324d;
      outline-offset: 3px;
    }

    @media (min-height: 740px) {
      body {
        align-items: center;
      }
    }

    @media (max-width: 380px) {
      body {
        padding: 10px;
      }

      .scene {
        border-radius: 24px;
      }

      .text {
        top: 48px;
        right: 18px;
        left: 18px;
      }

      .final {
        right: 18px;
        left: 18px;
      }

      .album {
        width: 96%;
      }

      .bouquetBranch.b1 {
        --angle: -26deg;
        --height: 225px;
      }

      .bouquetBranch.b2 {
        --angle: -13deg;
        --height: 270px;
      }

      .bouquetBranch.b3 {
        --angle: 14deg;
        --height: 265px;
      }

      .bouquetBranch.b4 {
        --angle: 26deg;
        --height: 225px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        transition-delay: 0s !important;
      }

      /*
        Se corta la lluvia de pétalos, pero los que ya aterrizaron se quedan:
        el rastro en el suelo es contenido, no decoración animada.
      */
      .fallingPetal {
        display: none;
      }

      .flower.pluckable .petal:not(.back) {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <script>
    const txt = document.getElementById('txt');
    const btn = document.getElementById('action');
    const seed = document.getElementById('seed');
    const stem = document.getElementById('stem');
    const leaf1 = document.getElementById('leaf1');
    const leaf2 = document.getElementById('leaf2');
    const flower = document.getElementById('flower');
    const bouquet = document.getElementById('bouquet');
    const final = document.getElementById('final');
    const photoWrap = document.getElementById('photoWrap');
    const musicBtn = document.getElementById('musicBtn');
    const musicPanel = document.getElementById('musicPanel');
    const scene = document.getElementById('scene');
    const hint = document.getElementById('hint');
    const petalsLayer = document.getElementById('petalsLayer');
    const fallenPetals = document.getElementById('fallenPetals');
    const petals = Array.from(flower.querySelectorAll('.petal:not(.back)'));
    const collage = document.getElementById('collage');
    const photoFallback = document.getElementById('photoFallback');
    const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
    /*
      Se usa YouTube y no Spotify a propósito: el embed de Spotify solo da la
      canción completa si quien escucha tiene sesión Premium abierta en ese
      mismo navegador, y si no, corta a los 30 segundos. YouTube la reproduce
      completa sin cuenta ni login, que es el caso real de quien abra el enlace.
    */
    const youtubeVideoId = 'GE0e0hEZkZ4';

    /*
      El crecimiento ya no avanza a botonazos: corre solo. El mensaje central lo
      entrega ella deshojando la flor, un pétalo por línea. Así el botón de abajo
      se usa 3 veces en toda la página (empezar, ver foto, reiniciar) en vez de 8.
    */
    const growthPhrases = [
      'Mor, hay algo que quiero decirte…',
      'Contigo aprendí que lo más bonito crece despacio…',
      'con tiempo, cuidado y mucha paciencia. 💙'
    ];

    /* Una línea por pétalo, en este orden, sin importar cuál toque primero. */
    const petalPhrases = [
      'Te quiero…',
      'te quiero en lo bueno…',
      'te quiero en lo difícil…',
      'te quiero sin tener que pensarlo…',
      'y te voy a querer mañana otra vez. 💙'
    ];

    const bouquetPhrase = 'Deshojaste una… y nacieron todas estas. 💙';

    /* Etapas del recorrido. Reemplazan los booleanos sueltos de antes. */
    const STAGE_IDLE = 'idle';
    const STAGE_GROWING = 'growing';
    const STAGE_PLUCKING = 'plucking';
    const STAGE_BOUQUET = 'bouquet';
    const STAGE_ALBUM = 'album';

    const maxRestingPetals = 26;

    let stage = STAGE_IDLE;
    let pluckedCount = 0;
    let petalRainTimer = null;
    let musicPlayer = null;
    let musicReady = false;
    let musicPlaying = false;
    let musicPlaybackRequested = false;
    let musicManuallyPaused = false;
    let musicPanelHideTimer = null;
    const pendingTimers = new Set();

    function motionDelay(milliseconds) {
      return motionQuery.matches ? 0 : milliseconds;
    }

    function schedule(callback, milliseconds, preserveDelay = false) {
      const delay = preserveDelay ? milliseconds : motionDelay(milliseconds);
      const timer = window.setTimeout(() => {
        pendingTimers.delete(timer);
        callback();
      }, delay);
      pendingTimers.add(timer);
      return timer;
    }

    function clearPendingTimers() {
      pendingTimers.forEach((timer) => window.clearTimeout(timer));
      pendingTimers.clear();
    }

    function setVisible(element, isVisible) {
      element.classList.toggle('show', isVisible);
      element.setAttribute('aria-hidden', String(!isVisible));
    }

    /*
      El botón se esconde durante el crecimiento y el deshojado, para que la
      única cosa que invite a tocar sean los pétalos. Se oculta con visibility
      y no con hidden, así no cambia el alto del layout.
    */
    function hideButton() {
      btn.classList.add('hidden');
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
    }

    function showButton(label) {
      btn.textContent = label;
      btn.classList.remove('hidden');
      btn.disabled = false;
      btn.setAttribute('aria-busy', 'false');
    }

    function sayPhrase(text) {
      setVisible(txt, false);
      schedule(() => {
        txt.textContent = text;
        setVisible(txt, true);
      }, 260);
    }

    function showHint(text) {
      hint.textContent = text;
      hint.classList.add('show');
      hint.setAttribute('aria-hidden', 'false');
    }

    function hideHint() {
      hint.classList.remove('show');
      hint.setAttribute('aria-hidden', 'true');
    }

    /* Etapa 1: crece sola, sin clics. */
    function runGrowth() {
      stage = STAGE_GROWING;
      hideButton();

      seed.classList.remove('sprouting');
      seed.classList.add('show');
      stem.style.height = '0';
      sayPhrase(growthPhrases[0]);

      schedule(() => {
        seed.classList.remove('show');
        seed.classList.add('sprouting');
        stem.style.height = '205px';
        leaf1.classList.add('show');
        sayPhrase(growthPhrases[1]);
      }, 2400, true);

      schedule(() => {
        stem.style.height = '255px';
        leaf2.classList.add('show');
        sayPhrase(growthPhrases[2]);
      }, 5000, true);

      schedule(() => {
        flower.classList.add('show');
        setVisible(txt, false);
      }, 7600, true);

      schedule(startPlucking, 9200, true);
    }

    /* Etapa 2: ella deshoja, y cada pétalo entrega una línea. */
    function startPlucking() {
      stage = STAGE_PLUCKING;
      pluckedCount = 0;
      flower.classList.add('pluckable');
      petals.forEach((petal) => {
        petal.disabled = false;
      });
      showHint('Deshójala: toca un pétalo 💙');
    }

    function pluckPetal(petal) {
      if (stage !== STAGE_PLUCKING || petal.classList.contains('plucked')) {
        return;
      }

      petal.classList.add('plucked');
      petal.disabled = true;
      spawnPluckedPetal();

      sayPhrase(petalPhrases[pluckedCount]);
      pluckedCount += 1;

      const left = petalPhrases.length - pluckedCount;
      if (left > 0) {
        showHint(left === 1 ? 'Queda un pétalo' : `Quedan ${left} pétalos`);
        return;
      }

      hideHint();
      flower.classList.remove('pluckable');
      schedule(revealBouquet, 2600, true);
    }

    /* Etapa 3: el pago del deshojado. Se deshoja una y aparecen muchas. */
    function revealBouquet() {
      stage = STAGE_BOUQUET;
      bouquet.classList.add('show');
      sayPhrase(bouquetPhrase);

      schedule(() => {
        setVisible(txt, false);
        setVisible(final, true);
        showButton('Ver nuestra foto 🥰');
      }, 3600, true);
    }

    function showAlbum() {
      stage = STAGE_ALBUM;
      hideButton();
      setVisible(final, false);

      schedule(() => {
        setVisible(photoWrap, true);
        showButton('Volver a empezar 💙');
      }, 500);
    }

    function reset() {
      clearPendingTimers();
      stage = STAGE_IDLE;
      pluckedCount = 0;
      txt.textContent = '';
      setVisible(txt, false);
      setVisible(final, false);
      setVisible(photoWrap, false);
      hideHint();

      seed.classList.remove('show', 'sprouting');
      leaf1.classList.remove('show');
      leaf2.classList.remove('show');
      flower.classList.remove('show', 'pluckable');
      bouquet.classList.remove('show');
      stem.style.height = '0';

      petals.forEach((petal) => {
        petal.classList.remove('plucked');
        petal.disabled = true;
      });

      /* Borra el rastro del suelo para que al reiniciar la escena esté limpia. */
      fallenPetals.replaceChildren();
      petalsLayer.replaceChildren();

      showButton('Comenzar 💙');
    }

    function onButtonClick() {
      if (stage === STAGE_IDLE) {
        if (!musicPlaying && !musicManuallyPaused) {
          requestMusicPlayback();
        }
        runGrowth();
        return;
      }

      if (stage === STAGE_BOUQUET) {
        showAlbum();
        return;
      }

      if (stage === STAGE_ALBUM) {
        reset();
      }
    }

    function clearMusicPanelHideTimer() {
      if (musicPanelHideTimer !== null) {
        window.clearTimeout(musicPanelHideTimer);
        musicPanelHideTimer = null;
      }
    }

    function showMusicPanel() {
      clearMusicPanelHideTimer();
      document.body.classList.add('music-open');
      musicPanel.classList.add('show');
      musicPanel.setAttribute('aria-hidden', 'false');
      musicPanel.inert = false;
      musicBtn.setAttribute('aria-expanded', 'true');
    }

    function hideMusicPanel() {
      clearMusicPanelHideTimer();
      document.body.classList.remove('music-open');
      musicPanel.classList.remove('show');
      musicPanel.setAttribute('aria-hidden', 'true');
      musicPanel.inert = true;
      musicBtn.setAttribute('aria-expanded', 'false');
    }

    function scheduleMusicPanelHide() {
      if (!musicPanel.classList.contains('show') || musicPanelHideTimer !== null) {
        return;
      }

      musicPanelHideTimer = window.setTimeout(() => {
        musicPanelHideTimer = null;
        if (musicPlaying) {
          hideMusicPanel();
        }
      }, 650);
    }

    function updateMusicButton() {
      musicBtn.textContent = musicPlaying ? '⏸' : '🎵';
      musicBtn.classList.toggle('playing', musicPlaying);
      musicBtn.setAttribute('aria-pressed', String(musicPlaying));
      const label = musicPlaying ? 'Pausar la canción' : 'Reproducir la canción';
      musicBtn.setAttribute('aria-label', label);
      musicBtn.title = label;
    }

    function requestMusicPlayback() {
      showMusicPanel();
      musicPlaybackRequested = true;

      if (musicPlayer && musicReady) {
        try {
          musicPlayer.playVideo();
        } catch (error) {
          /* El reproductor visible permite iniciar la canción manualmente. */
        }
      }
    }

    function toggleMusicPlayback() {
      if (!musicPlayer || !musicReady) {
        showMusicPanel();
        musicManuallyPaused = false;
        musicPlaybackRequested = true;
        return;
      }

      try {
        if (musicPlaying) {
          clearMusicPanelHideTimer();
          musicManuallyPaused = true;
          musicPlaybackRequested = false;
          musicPlaying = false;
          updateMusicButton();
          musicPlayer.pauseVideo();
        } else {
          musicManuallyPaused = false;
          musicPlaybackRequested = true;
          musicPlayer.playVideo();
        }
      } catch (error) {
        showMusicPanel();
        /* El usuario todavía puede usar los controles del reproductor. */
      }
    }

    window.onYouTubeIframeAPIReady = () => {
      const playerVars = {
        /* Evita que iOS se lleve el video a pantalla completa. */
        playsinline: 1,
        /* Visibles como respaldo si el navegador bloquea el arranque. */
        controls: 1,
        rel: 0,
        modestbranding: 1,
        /* loop necesita playlist con el mismo id para repetir un solo video. */
        loop: 1,
        playlist: youtubeVideoId
      };

      /* La API pide el origen, pero con file:// no existe y rompería la carga. */
      if (window.location.protocol.startsWith('http')) {
        playerVars.origin = window.location.origin;
      }

      musicPlayer = new YT.Player('musicPlayer', {
        videoId: youtubeVideoId,
        playerVars,
        events: {
          onReady: () => {
            musicReady = true;
            if (musicPlaybackRequested && !musicManuallyPaused) {
              try {
                musicPlayer.playVideo();
              } catch (error) {
                /* El reproductor visible funciona como respaldo. */
              }
            }
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              musicPlaying = true;
              musicPlaybackRequested = false;
              updateMusicButton();
              scheduleMusicPanelHide();
              return;
            }

            if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
              musicPlaying = false;
              clearMusicPanelHideTimer();
              updateMusicButton();
            }
          },
          onError: () => {
            /* Queda el enlace para abrir la canción directo en YouTube. */
            showMusicPanel();
          }
        }
      });
    };

    /*
      La escena usa clamp() para su alto, así que la distancia de caída se mide
      en vivo. El suelo visible arranca unos 118px sobre el borde inferior.
    */
    function fallDistance() {
      /*
        El pétalo arranca en top:-28px y mide 21px de alto, así que para que su
        borde inferior caiga sobre la tierra (120px desde el fondo) la distancia
        tiene que ser alto - 113. Si no, aterriza flotando o enterrado.
      */
      return Math.max(240, scene.clientHeight - 113);
    }

    function restPetal(startLeftPercent, driftPx) {
      const resting = document.createElement('div');
      resting.className = 'restingPetal';

      /* La deriva viene en px; se pasa a % para colocarla sobre el ancho real. */
      const driftPercent = (driftPx / Math.max(1, scene.clientWidth)) * 100;
      const left = Math.min(93, Math.max(2, startLeftPercent + driftPercent));
      resting.style.left = `${left}%`;
      /* Se dispersan un poco en profundidad: un montón plano se ve artificial. */
      resting.style.bottom = `${Math.random() * 16}px`;
      resting.style.setProperty('--lie', `${Math.random() * 180 - 90}deg`);

      fallenPetals.appendChild(resting);

      /* Tope para que el montón no infle el DOM en visitas largas. */
      while (fallenPetals.children.length > maxRestingPetals) {
        fallenPetals.firstElementChild.remove();
      }
    }

    function spawnFallingPetal(options = {}) {
      const petal = document.createElement('div');
      petal.className = options.plucked ? 'fallingPetal plucked' : 'fallingPetal';

      const startLeft = options.left ?? 6 + Math.random() * 86;
      const drift = Math.random() * 90 - 45;

      petal.style.left = `${startLeft}%`;
      if (options.top !== undefined) {
        petal.style.top = `${options.top}px`;
      }
      petal.style.setProperty('--drift', `${drift}px`);
      petal.style.setProperty('--fall-distance', `${options.distance ?? fallDistance()}px`);
      petal.style.setProperty('--spin', `${200 + Math.random() * 340}deg`);
      petal.style.setProperty('--fall-time', `${options.time ?? 6 + Math.random() * 3}s`);

      /* Al terminar la caída deja de ser partícula y pasa a ser rastro. */
      petal.addEventListener('animationend', () => {
        petal.remove();
        restPetal(startLeft, drift);
      }, { once: true });

      petalsLayer.appendChild(petal);
    }

    /* El pétalo arrancado sale de la flor, no del borde de arriba. */
    function spawnPluckedPetal() {
      const startTop = scene.clientHeight * 0.28333 + 40;

      spawnFallingPetal({
        plucked: true,
        left: 44 + Math.random() * 12,
        top: startTop,
        distance: Math.max(110, fallDistance() - startTop),
        time: 2.2 + Math.random() * 0.6
      });
    }

    function syncPetalRain() {
      if (petalRainTimer !== null) {
        window.clearInterval(petalRainTimer);
        petalRainTimer = null;
      }

      if (motionQuery.matches || document.hidden) {
        petalsLayer.replaceChildren();
        return;
      }

      spawnFallingPetal();
      petalRainTimer = window.setInterval(() => spawnFallingPetal(), 1500);
    }

    musicBtn.addEventListener('click', toggleMusicPlayback);
    btn.addEventListener('click', onButtonClick);

    petals.forEach((petal) => {
      petal.addEventListener('click', () => pluckPetal(petal));
    });

    document.addEventListener('visibilitychange', syncPetalRain);

    if (typeof motionQuery.addEventListener === 'function') {
      motionQuery.addEventListener('change', syncPetalRain);
    } else {
      motionQuery.addListener(syncPetalRain);
    }

    collage.addEventListener('error', () => {
      collage.hidden = true;
      photoFallback.hidden = false;
    }, { once: true });

    syncPetalRain();
  </script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
