<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Página puente, a propósito vacía de pistas.

    Las páginas de regalo viven en rutas propias (sorpresa.html, flor.html) y
    aquí NO se enlazan nunca: si alguien recorta la URL hasta la raíz por
    curiosidad, tiene que quedarse sin saber qué más hay publicado.
  -->
  <meta name="description" content="Hola.">
  <meta name="theme-color" content="#14161f">
  <title>Hola</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(ellipse at 50% 30%, #272b3a 0%, #14161f 70%);
      color: #cdd3e4;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .mark {
      font-size: clamp(2.6rem, 12vw, 4rem);
      line-height: 1;
      animation: beat 2.6s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.09);
      }
    }

    p {
      max-width: 22ch;
      margin: 0;
      padding: 0 20px;
      color: #8e97ae;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      .mark {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="mark" role="img" aria-label="Un corazón">🧡</div>
  <p>Nada que ver por aquí todavía.</p>
</body>
</html>
